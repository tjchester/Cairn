# Typechecks and tests every push to the default branch and every pull request.
#
# Runs on Linux only: it is the cheapest runner (private repositories on a free account get 2,000 minutes a month,
# and Windows and macOS minutes count double and tenfold). The installers for all three platforms are built by
# release.yml, on version tags only.
#
# Actions are pinned to full commit SHAs, so a moved or hijacked tag cannot change what runs here. Dependabot
# (.github/dependabot.yml) proposes updates; the comment after each SHA says which release it is.

name: CI

on:
  push:
    # Whichever of these is the default branch.
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The unit tests never start Electron, so skip downloading its binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
