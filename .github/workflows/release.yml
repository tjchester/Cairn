# Builds Cairn for Windows, macOS and Linux and attaches the installers to a draft GitHub Release.
#
# To release: set "version" in package.json, commit, then push a matching tag:
#   git tag v0.1.0 && git push origin v0.1.0
# The draft appears under Releases; check it, edit the notes, and publish it by hand.
#
# Running the workflow by hand (Actions > Release > Run workflow) builds everything without
# releasing; the installers are kept as workflow artifacts instead, for a few days. (Tag builds don't
# keep artifacts: the installers are already in the release, and a free account's artifact storage
# for private repositories is only 500 MB.)
#
# Minutes: on a private repository a free account gets 2,000 a month, with macOS counting tenfold and
# Windows double, so one release costs roughly 150-250 of them. Public repositories are not charged.
#
# Actions are pinned to full commit SHAs (the comment gives the release); Dependabot proposes updates.
#
# Builds are unsigned. Windows SmartScreen will warn, and macOS needs right-click > Open the first time.
# To sign later, add CSC_LINK / CSC_KEY_PASSWORD (and APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD,
# APPLE_TEAM_ID for notarization) as repository secrets and pass them to the build step.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default; only the jobs that create or upload to the release get write access.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The unit tests never start Electron, so skip downloading its binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)."
            exit 1
          fi

  # Create the draft once, before the builds start, so the three build jobs all upload into the same
  # release instead of racing to create one each.
  draft:
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; the builds will upload into it."
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
              --title "Cairn $GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: [check, draft]
    # Run after "draft" on a tag, and when "draft" is skipped on a manual run.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            args: ''
          - os: macos-latest
            script: dist:mac
            # The macOS runner is Apple silicon; build Intel too so both kinds of Mac are covered.
            args: --x64 --arm64
          - os: ubuntu-latest
            script: dist:linux
            args: ''
    runs-on: ${{ matrix.os }}
    # A hung build should not burn through the month's minutes.
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # electron-builder still reads the repository from the remote URL; this only keeps the token out of .git/config.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No signing certificate yet: don't let electron-builder go looking for one in the keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          publish=never
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then publish=always; fi
          # The GitHub target is given here rather than in electron-builder.yml so local `npm run dist`
          # keeps working in a clone with no GitHub remote. It also writes latest*.yml for auto-update.
          npm run ${{ matrix.script }} -- ${{ matrix.args }} -c.publish.provider=github --publish "$publish"
      - name: Keep installers as workflow artifacts
        # Manual runs only: on a tag the installers are already attached to the release.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cairn-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 5
